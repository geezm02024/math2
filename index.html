<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematyka, klasa 4: kartkówka – liczby naturalne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCF7; --grid:#D9EBD7; --card:#FFFFFF; --text:#1C2333; --muted:#55607A;
  --ink:#1D3A8F; --line:#B9C3DA; --soft:#EEF2FA;
  --pink:rgba(255,79,176,.40); --orange:rgba(255,122,61,.42); --cyan:rgba(44,197,218,.42);
  --good:#0B7A54; --bad:#C8321A; --pen:#D62828;
  --hand:'Caveat','Comic Sans MS',cursive;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A2C; --grid:#1B2840; --card:#172238; --text:#E8EDF7; --muted:#A3AFC8;
    --ink:#A9BEFF; --line:#34446A; --soft:#1D2A44;
    --pink:rgba(255,79,176,.36); --orange:rgba(255,122,61,.36); --cyan:rgba(44,197,218,.33);
    --good:#4FD9A3; --bad:#FF7A61; --pen:#FF6B6B;
  }
}
:root[data-theme="dark"]{
  --paper:#111A2C; --grid:#1B2840; --card:#172238; --text:#E8EDF7; --muted:#A3AFC8;
  --ink:#A9BEFF; --line:#34446A; --soft:#1D2A44;
  --pink:rgba(255,79,176,.36); --orange:rgba(255,122,61,.36); --cyan:rgba(44,197,218,.33);
  --good:#4FD9A3; --bad:#FF7A61; --pen:#FF6B6B;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:var(--body);color:var(--text);font-size:17px;line-height:1.55;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.app{max-width:920px;margin:0 auto;padding:18px 14px 70px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-family:var(--hand);font-weight:700;font-size:clamp(2.2rem,6.5vw,3.2rem);line-height:1;margin:0;color:var(--ink)}
h1 span{background:linear-gradient(transparent 38%,var(--orange) 38% 88%,transparent 88%);padding:0 .15em}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500;font-size:.95rem}
nav button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 24px;margin-bottom:16px}
.panel h2{font-family:var(--hand);font-size:2.2rem;line-height:1.05;margin:0 0 8px;color:var(--ink)}
.panel h3{font-family:var(--hand);font-size:1.65rem;margin:18px 0 4px}
.muted{color:var(--muted)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 12px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hl-o{background:linear-gradient(transparent 40%,var(--orange) 40% 90%,transparent 90%)}
.hl-p{background:linear-gradient(transparent 40%,var(--pink) 40% 90%,transparent 90%)}
.hl-c{background:linear-gradient(transparent 40%,var(--cyan) 40% 90%,transparent 90%)}

/* ---------- PLAN ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.day{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font-family:var(--hand);font-size:1.9rem;line-height:1;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.day .done{font-family:var(--hand);font-size:1.6rem;color:var(--pen)}
.day .what{font-size:.95rem}
.day .row{margin-top:auto}
.tl{font-size:.9rem;color:var(--muted)}
.link{display:inline;border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit;text-align:left}
.weak{margin-top:6px}
.weak li{margin:2px 0}

/* ---------- POWTÓRKA ---------- */
.learn{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.toc{display:flex;flex-direction:column;gap:3px;position:sticky;top:calc(10px + env(safe-area-inset-top,0px))}
.toc button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.93rem;color:var(--text)}
.toc button[aria-current="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--ink);font-weight:600}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 4px;padding:20px 22px 24px;box-shadow:inset 34px 0 0 -32px var(--pen)}
.sheet h2{font-family:var(--hand);font-size:2.2rem;line-height:1.1;margin:0 0 6px;color:var(--ink)}
.sheet h3{font-family:var(--hand);font-size:1.6rem;margin:18px 0 4px}
.sheet p,.sheet li{max-width:66ch}
.sheet .src{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.ex{font-family:var(--hand);font-size:1.55rem;line-height:1.35;color:var(--ink);margin:6px 0;padding-left:12px;border-left:3px solid var(--line)}
.trap{border:2px solid var(--pen);border-radius:10px;padding:10px 14px;margin:14px 0}
.trap b:first-child{color:var(--pen)}
.key{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}
.key .k{font-family:var(--hand);font-size:1.5rem;line-height:1.2;color:var(--ink)}
.sq{border-collapse:collapse;margin:6px 0;font-variant-numeric:tabular-nums}
.sq td{border:1px solid var(--line);padding:3px 9px;text-align:center}

/* bar model */
.bars{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.bars .ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:10px}
.bars label{display:flex;align-items:center;gap:8px;font-size:.95rem}
.bars input[type=range]{accent-color:var(--ink);width:120px}
.bar{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
.bar .lab{font-size:.9rem}
.bar .track{display:flex;gap:2px;min-height:30px}
.seg{border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:.8rem;font-weight:600;min-width:0;overflow:hidden}
.seg.base{background:var(--cyan)}
.seg.add{background:var(--orange)}
.bar .res{grid-column:2;font-family:var(--hand);font-size:1.4rem;color:var(--ink);line-height:1}
/* dots */
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.grp{display:flex;gap:4px;padding:5px;border:2px dashed var(--ink);border-radius:10px}
.grp.left{border-color:var(--pen)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ink)}
.grp.left .dot{background:var(--pen)}

/* ---------- ZADANIA ---------- */
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.thead{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.tnum{flex:none;width:2.1em;height:2.1em;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:1.35rem;color:var(--ink)}
.tins{font-weight:500;padding-top:6px}
.tpts{margin-left:auto;color:var(--muted);font-size:.85rem;padding-top:8px;white-space:nowrap}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 22px}
.items.wide{grid-template-columns:1fr}
.items.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.it{display:flex;gap:8px;align-items:baseline;line-height:2.1}
.it .lt{color:var(--muted);flex:none}
.it .tx{flex:1}
input.blank{width:4.4em;padding:3px 6px;font-size:1.05rem;border:2px solid var(--line);border-radius:7px;background:var(--paper);text-align:center;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
sup input.blank{width:2.6em;font-size:.85rem;padding:1px 3px}
input.blank.ok{border-color:var(--good);background:var(--cyan)}
input.blank.no{border-color:var(--bad);background:var(--orange)}
.copts{display:grid;gap:6px;margin-top:6px}
.copt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;cursor:pointer;width:100%}
.copt .box{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.copt.sel{border-color:var(--ink);background:var(--pink)}
.copt.sel .box{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.copt.ok{border-color:var(--good);background:var(--cyan)}
.copt.no{border-color:var(--bad);background:var(--orange)}
.copt:disabled{cursor:default}
.topbar{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.topbar .clock{font-weight:600}
.topbar .clock.warn{color:var(--pen)}

/* ---------- TRENING ---------- */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tbtn{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
.tbtn:hover{border-color:var(--ink)}
.acc{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.acc i{display:block;height:100%;background:var(--ink)}
.tbtn small{color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qtext{font-size:1.2rem;line-height:1.9;margin:6px 0 4px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border:2px solid}
.fb.ok{border-color:var(--good)}.fb.half{border-color:var(--ink)}.fb.no{border-color:var(--bad)}
.fb b{display:block;margin-bottom:3px}
.steps{font-family:var(--hand);font-size:1.4rem;line-height:1.35;color:var(--ink);margin-top:4px}

/* ---------- WYNIKI ---------- */
.result-top{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px}
.grade{position:relative;width:140px;height:140px;flex:none}
.grade svg{position:absolute;inset:0;width:100%;height:100%}
.grade .digit{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:5.6rem;line-height:1;color:var(--pen)}
.grade path{fill:none;stroke:var(--pen);stroke-width:4;stroke-linecap:round;stroke-dasharray:620;stroke-dashoffset:620;animation:draw 1s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gname{font-family:var(--hand);font-size:2.3rem;line-height:1;color:var(--ink);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
.chip.bad{border-color:var(--bad)}
.review{list-style:none;padding:0;margin:18px 0 0}
.review li{border-top:1px solid var(--line);padding:12px 0}
.review .mk{font-weight:700;margin-right:6px}
.review .mk.ok{color:var(--good)}.review .mk.no{color:var(--bad)}.review .mk.half{color:var(--ink)}
.review .row2{font-size:.95rem;margin-top:2px}
table.hist{border-collapse:collapse;width:100%;font-size:.93rem}
table.hist td,table.hist th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.hist .g{font-family:var(--hand);font-size:1.6rem;color:var(--pen);line-height:1}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted)}
.scale td{padding:3px 10px 3px 0}
.scale input{width:4.2em;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}

.pre{margin:4px 0 8px}
.learn>*{min-width:0}
svg.axis{width:100%;max-width:640px;height:auto;display:block}
svg.axis line,svg.axis polyline{stroke:var(--text);stroke-width:2;fill:none}
svg.axis .lb{font:600 20px var(--body);fill:var(--text);text-anchor:middle}
svg.axis .pt{fill:var(--pen)}
svg.axis .pl{font:700 22px var(--body);fill:var(--pen);text-anchor:middle}
.sgn{display:inline-flex;gap:4px;vertical-align:middle;margin:0 4px}
.sg{width:2.4em;height:2.1em;border:2px solid var(--line);border-radius:8px;background:var(--paper);font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.sg.sel{border-color:var(--ink);background:var(--pink)}
.sg.ok{border-color:var(--good);background:var(--cyan)}
.sg.no{border-color:var(--bad);background:var(--orange)}
.sg:disabled{cursor:default}
.corr{color:var(--good);font-weight:600}
table.pv{border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
table.pv th,table.pv td{border:1px solid var(--line);padding:3px 8px;text-align:center;min-width:2em}
table.pv th{font-size:.8rem;font-weight:600}
table.pv td{font-family:var(--hand);font-size:1.8rem;color:var(--ink);line-height:1.1;height:1.5em}
table.pv .g1{background:var(--soft)}
.chip-s{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip-s.on{border-color:var(--ink);background:var(--pink)}
@media (max-width:720px){
  .learn{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .toc button{white-space:nowrap}
  .panel,.sheet{padding:16px 14px 20px}
  .bar{grid-template-columns:1fr}
  .bar .res{grid-column:1}
  .items{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.grade path{animation:none;stroke-dashoffset:0}.progress i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1><span>Matematyka, klasa 4</span></h1>
      <p class="sub">Liczby naturalne, duże liczby, oś liczbowa, złote i grosze – przygotowanie do kartkówki</p>
    </div>
    <nav id="nav">
      <button data-v="plan">Plan</button>
      <button data-v="learn">Powtórka</button>
      <button data-v="train">Trening</button>
      <button data-v="test">Kartkówka</button>
      <button data-v="results">Wyniki</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
/* ================= POMOCNICZE ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=n=>typeof n==='number'&&n>=10000?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0'):String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=n=>String(Math.round(n*10)/10).replace('.',',');
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const B='[]';

/* ================= TEMATY ================= */
const TOPICS=[
 {id:'kol',name:'Kolejność wykonywania działań',src:'zeszyt ćw. s. 21–22'},
 {id:'os',name:'Oś liczbowa',src:'zeszyt ćw. s. 23'},
 {id:'sys',name:'System dziesiątkowy',src:'zeszyt ćw. s. 24 i 26'},
 {id:'duze',name:'Duże liczby: słownie i cyframi',src:'zeszyt ćw. s. 24–25'},
 {id:'por',name:'Porównywanie liczb',src:'zeszyt ćw. s. 27–28'},
 {id:'pam',name:'Rachunki pamięciowe na dużych liczbach',src:'zeszyt ćw. s. 29–30'},
 {id:'pln',name:'Złote i grosze',src:'zeszyt ćw. s. 31'},
];
const tname=id=>TOPICS.find(t=>t.id===id).name;
const SG='[?]',LT='&lt;',GT='&gt;';
const sgH=s=>s==='<'?LT:GT;

/* ================= LICZBY SŁOWNIE ================= */
const W1=['','jeden','dwa','trzy','cztery','pięć','sześć','siedem','osiem','dziewięć'];
const WN=['dziesięć','jedenaście','dwanaście','trzynaście','czternaście','piętnaście','szesnaście','siedemnaście','osiemnaście','dziewiętnaście'];
const WT=['','','dwadzieścia','trzydzieści','czterdzieści','pięćdziesiąt','sześćdziesiąt','siedemdziesiąt','osiemdziesiąt','dziewięćdziesiąt'];
const WH=['','sto','dwieście','trzysta','czterysta','pięćset','sześćset','siedemset','osiemset','dziewięćset'];
const WG=[null,['tysiąc','tysiące','tysięcy'],['milion','miliony','milionów'],['miliard','miliardy','miliardów']];
function w3(n){const h=Math.floor(n/100),t=Math.floor(n/10)%10,u=n%10,r=[];if(h)r.push(WH[h]);if(t===1)r.push(WN[u]);else{if(t)r.push(WT[t]);if(u)r.push(W1[u])}return r.join(' ')}
function decl(n,f){if(n===1)return f[0];const t=n%100,u=n%10;return (u>=2&&u<=4&&!(t>=12&&t<=14))?f[1]:f[2]}
function groupsOf(n){const g=[];do{g.push(n%1000);n=Math.floor(n/1000)}while(n>0);return g}
function fromGroups(g){return g.reduceRight((a,v)=>a*1000+v,0)}
function words(n,bad){
  if(n===0)return 'zero';const g=groupsOf(n),out=[];
  for(let i=g.length-1;i>=0;i--){const v=g[i];if(!v)continue;
    if(i===0){out.push(w3(v));continue}
    const f=WG[i];if(v===1){out.push(i===1?'tysiąc':'jeden '+f[0]);continue}
    let fm=decl(v,f);if(bad===i)fm=fm===f[1]?f[2]:f[1];out.push(w3(v)+' '+fm)}
  return out.join(' ');
}
const RZ=['jedności','dziesiątek','setek','tysięcy','dziesiątek tysięcy','setek tysięcy','milionów','dziesiątek milionów','setek milionów','miliardów'];
const cyfrW=n=>decl(n,['cyfrę','cyfry','cyfr']);
const zerW=n=>n===1?'jedno zero':n+' '+decl(n,['zero','zera','zer']);
function hlDigit(n,p){const s=String(n),L=s.length;let o='';for(let k=0;k<L;k++){const r=L-1-k;o+=r===p?`<b class="hl-o">${s[k]}</b>`:s[k];if(r%3===0&&r>0&&L>4)o+=' '}return o}
function groupsLabel(n){const g=groupsOf(n),nm=['','tys.','mln','mld'];const L=g.length;return g.map((v,i)=>({v,i})).reverse().map(({v,i},k)=>`${k===0?v:String(v).padStart(3,'0')}${nm[i]?' '+nm[i]:''}`).join(' | ')}
function bigNum(minG,maxG){const gc=R(minG,maxG);let n=0;
  for(let i=gc-1;i>=0;i--){let v;
    if(i===gc-1)v=pick([R(1,9),R(10,99),R(100,999),R(1,9)*100,R(2,9)*10]);
    else v=pick([0,0,R(1,9),R(10,99),R(1,9)*100,R(100,999),R(1,9)*100+R(1,9)]);
    n=n*1000+v}
  return n}
const zgT=g=>g<100?`${g} gr`:`${Math.floor(g/100)} zł${g%100?` ${g%100} gr`:''}`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const gcd=(a,b)=>b?gcd(b,a%b):a;

/* ================= OŚ LICZBOWA (SVG) ================= */
function axisSVG(n,labels,points){
  const W=640,x0=26,x1=W-46,dx=(x1-x0)/n;
  let s=`<svg class="axis" viewBox="0 0 ${W} 92" role="img" aria-label="oś liczbowa">`;

function make(topic,name){
  const raw=G[topic][name]();
  const it={...raw,topic,gen:[topic,name]};
  if(it.t==='choice'){const oi=raw.okIdx??0;const o=raw.opts.map((x,i)=>({x,ok:i===oi}));it.opts=raw.keep?o:shuffle(o)}
  return it;
}
function anyFrom(topic){return make(topic,pick(Object.keys(G[topic])))}

  const SPEC=[
    {tp:['kol'],ins:'Oblicz, pamiętając o kolejności wykonywania działań.',f:()=>[P('kol','mix'),P('kol','mix'),P('kol','three'),P('kol','three')],s:()=>[P('kol','mix'),P('kol','three'),P('kol','three')]},
    {tp:['kol'],ins:'Oblicz oba działania. Zobacz, co zmienia nawias.',f:()=>[P('kol','pair')]},
    {tp:['kol'],ins:'Zapisz zdanie jako działanie i oblicz.',f:()=>[P('kol','slowne'),P('kol','slowne')],s:()=>[P('kol','slowne')]},
    {tp:['os'],ins:'Oś liczbowa.',f:()=>[X('os',['read','read','offset']),X('os',['offset','unit','which'])],s:()=>[X('os',['read','offset'])]},
    {tp:['sys'],ins:'Oblicz (a) i rozłóż liczbę (b).',f:()=>[P('sys','compose'),P('sys','decompose')],s:()=>[P('sys','compose'),P('sys','decompose')]},
    {tp:['sys'],ins:'Uzupełnij.',f:()=>[P('sys','digit'),P('sys','count'),P('sys','clue')],s:()=>[P('sys','digit'),P('sys','count')]},
    {tp:['duze'],ins:'Zapisz liczby cyframi.',f:()=>[P('duze','toDigits'),P('duze','toDigits'),P('duze','abbr')],s:()=>[P('duze','toDigits'),P('duze','abbr')]},
    {tp:['duze'],ins:'Wybierz poprawny zapis słowny.',f:()=>[P('duze','toWords')],s:()=>[P('duze','toWords')]},
    {tp:['por'],ins:'Wstaw znak &lt; lub &gt;. W b) i d) nie wykonuj działań.',f:()=>[P('por','cmp'),P('por','noCalc'),P('por','cmp'),P('por','noCalc')],s:()=>[P('por','cmp'),P('por','noCalc'),P('por','cmp'),P('por','noCalc')]},

function stats(){return store('m5-stats')||{}}
function addStat(topic,ok){const s=stats();s[topic]=s[topic]||{ok:0,n:0};s[topic].n++;if(ok)s[topic].ok++;store('m5-stats',s)}
function acc(topic){const s=stats()[topic];return s&&s.n?s.ok/s.n:null}
function weakTopics(){return TOPICS.map(t=>({id:t.id,a:acc(t.id),n:(stats()[t.id]||{}).n||0})).filter(x=>x.n>=4&&x.a<0.8).sort((a,b)=>a.a-b.a)}

  <div class="days">${PLAN.map((d,i)=>`<article class="day ${i===today?'today':''}">
    <div class="dn">${d.label}${ps[i]?`<span class="done" title="ocena z kartkówki próbnej">${ps[i]}</span>`:''}</div>
    <div class="what">${d.what}</div>
    ${d.topics.length?`<div class="tl">Powtórka: ${d.topics.map(t=>`<button class="link" data-learn="${t}">${tname(t)}</button>`).join(', ')}</div>`:''}
    <div class="row">${d.topics.length?`<button class="btn small ghost" data-dtrain="${i}">Trening dnia</button>`:`<button class="btn small ghost" data-dfix="1">Popraw stare błędy</button>`}<button class="btn small" data-dtest="${i}">${d.topics.length?'Kartkówka próbna':'Próba generalna (25 min)'}</button></div>
  </article>`).join('')}</div>`;
  main.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{S.topic=b.dataset.learn;go('learn')});
  main.querySelectorAll('[data-dtrain]').forEach(b=>b.onclick=()=>startTrain(PLAN[+b.dataset.dtrain].topics,10,'Trening: '+PLAN[+b.dataset.dtrain].label));
  main.querySelectorAll('[data-dtest]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dtest,last=i===PLAN.length-1;startTest(i,last?25*60:0,'short',last?null:PLAN.slice(0,i+1).flatMap(d=>d.topics))});
  main.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>startTrain([b.dataset.tw],10,tname(b.dataset.tw)));

}

const NOTES={
kol:`<h2>Kolejność wykonywania działań</h2>

os:`<h2>Oś liczbowa</h2>

sys:`<h2>System dziesiątkowy</h2>

duze:`<h2>Duże liczby: tysiące, miliony, miliardy</h2>

por:`<h2>Porównywanie liczb</h2>
<div class="key"><span class="k">&lt;</span><span>jest mniejsza: 312 &lt; 315</span><span class="k">&gt;</span><span>jest większa: 802 &gt; 801</span></div>

pam:`<h2>Rachunki pamięciowe na dużych liczbach</h2>

pln:`<h2>Złote i grosze</h2>

function placeWidget(init){
  const host=document.getElementById('pv');if(!host)return;
  host.innerHTML=`<div class="ctl"><label>liczba <input id="pvin" class="blank" style="width:11em" inputmode="numeric" autocomplete="off" value="${init}" aria-label="wpisz liczbę"></label></div><div id="pvout"></div>`;
  const inp=host.querySelector('#pvin'),out=host.querySelector('#pvout');
  const draw=()=>{const v=inp.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,12);if(inp.value!==v)inp.value=v;
    const n=v===''?0:parseInt(v,10),s=String(n),Gc=Math.max(2,Math.ceil(s.length/3)),pad=s.padStart(Gc*3,' ');
    const cls=['jedności','tysiące','miliony','miliardy'];let h1='',h2='',h3='';
    for(let g=Gc-1;g>=0;g--){h1+=`<th colspan="3" class="g${g%2}">${cls[g]}</th>`;['S','D','J'].forEach(x=>h2+=`<th class="g${g%2}">${x}</th>`);
      for(let j=0;j<3;j++){const ch=pad[(Gc-1-g)*3+j];h3+=`<td class="g${g%2}">${ch===' '?'':ch}</td>`}}
    const terms=[];for(let k=0;k<s.length;k++){const d=+s[k],p=s.length-1-k;if(d)terms.push(p?`${d} · ${fmt(10**p)}`:`${d}`)}
    out.innerHTML=`<div style="overflow-x:auto"><table class="pv"><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></table></div>
    <p class="muted" style="margin:4px 0 0;font-size:.85rem">S – setki, D – dziesiątki, J – jedności w każdej grupie</p>
    <div class="steps">${fmt(n)} = ${terms.join(' + ')||'0'}</div><p style="margin:4px 0 0"><b>Słownie:</b> ${words(n)}</p>`};
  inp.oninput=draw;draw();
}
function axisWidget(){
  const host=document.getElementById('ax');if(!host)return;let u=25,p=7;const steps=[1,2,5,10,25,50,100];
  const draw=()=>{host.innerHTML=`<div class="ctl"><span>jedna działka:</span>${steps.map(s=>`<button type="button" class="chip-s ${s===u?'on':''}" data-u="${s}" aria-pressed="${s===u}">${s}</button>`).join('')}</div>
    <div class="ctl"><label>punkt A na kresce <input type="range" min="1" max="12" value="${p}" id="axp"> <b>${p}</b></label></div>
    ${axisSVG(12,{0:'0',1:fmt(u)},[{i:p,l:'A'}])}

    host.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{u=+b.dataset.u;draw();host.querySelector(`[data-u="${u}"]`).focus()});

function itemHTML(it,key,state){
  // state: undefined (edycja) | {user, res}
  const pre=it.pre?`<div class="pre">${it.pre}</div>`:'';
  if(it.t==='choice'){
    return `<div class="tx">${pre}${it.q}<div class="copts">${it.opts.map((o,i)=>{
      let c='';if(state){if(o.ok)c='ok';else if(state.user===i)c='no'}else if(it.user===i)c='sel';
      return `<button class="copt ${c}" data-k="${key}" data-o="${i}" ${state?'disabled':''}><span class="box">${state?(o.ok?'✓':(state.user===i?'✗':'')):(it.user===i?'●':'')}</span>${esc(o.x)}</button>`}).join('')}</div></div>`;
  }
  const big=it.ans.some(a=>typeof a==='number'&&a>=10000);
  let h='',i=0;
  it.q.split(/(\[\]|\[\?\])/).forEach(p=>{
    if(p==='[]'){const a=it.ans[i],v=state?(state.user[i]??''):((it.user&&it.user[i])||''),c=state?(state.res[i]?'ok':'no'):'';
      h+=`<input class="blank ${c}" style="width:${big?'9.5em':'4.4em'}" data-k="${key}" data-i="${i}" inputmode="numeric" autocomplete="off" value="${esc(v)}" ${state?'disabled':''} aria-label="okienko ${i+1}">`;
      if(state&&!state.res[i])h+=`<small class="corr"> → ${esc(fmt(a))}</small>`;i++}
    else if(p==='[?]'){const a=it.ans[i],u=state?state.user[i]:(it.user&&it.user[i]);
      h+=`<span class="sgn" role="group" aria-label="wybierz znak">${['<','>'].map(s=>{let c='';if(state){if(s===a)c='ok';else if(u===s)c='no'}else if(u===s)c='sel';
        return `<button type="button" class="sg ${c}" data-k="${key}" data-i="${i}" data-s="${s}" aria-pressed="${u===s}" ${state?'disabled':''}>${sgH(s)}</button>`}).join('')}</span>`;i++}
    else h+=p});
  return `<div class="tx">${pre}${h}</div>`;
}
const clean=v=>String(v??'').replace(/\s/g,'');
function checkItem(it,user){
  if(it.t==='choice'){const ok=user!=null&&it.opts[user].ok;return {res:[ok],p:ok?1:0,user}}
  const res=it.ans.map((a,i)=>{if(typeof a==='string')return user[i]===a;const s=clean(user[i]);return s!==''&&/^\d+$/.test(s)&&parseInt(s,10)===a});
  return {res,p:res.filter(Boolean).length,user};
}

  main.querySelectorAll('#tchoice button').forEach(b=>b.onclick=()=>{secs=+b.dataset.s;main.querySelectorAll('#tchoice button').forEach(x=>x.classList.toggle('ghost',x!==b))});
  document.getElementById('go').onclick=()=>startTest(null,secs,mode,null);
  main.querySelectorAll('.scale input').forEach(inp=>inp.onchange=()=>{const s=getScale();s[inp.dataset.g]=Math.max(0,Math.min(100,+inp.value||0));store('m5-scale',s);renderTestSetup();main.querySelector('details').open=true});
  document.getElementById('rs').onclick=()=>{store('m5-scale',{...DEF_SCALE});renderTestSetup();main.querySelector('details').open=true};
}
let clockId=null;
function stopClock(){if(clockId){clearInterval(clockId);clockId=null}}
function startTest(day,secs,mode,topics){
  const tasks=buildTest(mode||'short',topics||null);tasks.forEach(t=>t.items.forEach(it=>it.user=it.t==='choice'?null:[]));
  S.test={tasks,day,secs,start:Date.now()};go('testrun');
  stopClock();clockId=setInterval(tick,1000);tick();
}
function tick(){const T=S.test;if(!T)return;const el=document.getElementById('clock');const e=(Date.now()-T.start)/1000;
  if(T.secs){const left=Math.max(0,T.secs-e);if(el){el.textContent=mmss(left);el.classList.toggle('warn',left<=300)}if(left<=0){finishTest(true)}}
  else if(el)el.textContent=mmss(e)}
const mmss=s=>{s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function countAnswered(){let a=0,n=0;S.test.tasks.forEach(t=>t.items.forEach(it=>{if(it.t==='choice'){n++;if(it.user!=null)a++}else it.ans.forEach((_,i)=>{n++;if(clean(it.user[i])!=='')a++})}));return [a,n]}
function renderTest(){
  const T=S.test;const total=T.tasks.reduce((s,t)=>s+t.items.reduce((x,it)=>x+maxPts(it),0),0);
  main.innerHTML=`<div class="topbar"><span class="clock" id="clock">00:00</span><span id="prog"></span><button class="btn small" id="fin">Sprawdź</button></div>
  ${T.tasks.map((t,ti)=>{const mp=t.items.reduce((x,it)=>x+maxPts(it),0);const L=Math.max(...t.items.map(it=>it.q.length));const wide=t.items.some(it=>it.wide||it.t==='choice')||L>70?'wide':L>26?'two':'';
    return `<section class="task"><div class="thead"><span class="tnum">${ti+1}</span><span class="tins">${t.ins}</span><span class="tpts">${mp} pkt</span></div>
    <div class="items ${wide}">${t.items.map((it,ii)=>`<div class="it">${t.items.length>1?`<span class="lt">${'abcdef'[ii]})</span>`:''}${itemHTML(it,ti+'-'+ii)}</div>`).join('')}</div></section>`}).join('')}
  <div class="row" style="justify-content:flex-end"><button class="btn" id="fin2">Sprawdź sprawdzian</button></div>`;
  const prog=()=>{const [a,n]=countAnswered();document.getElementById('prog').textContent=`${a} / ${n} okienek`};prog();tick();
  const itemOf=k=>{const [a,b]=k.split('-').map(Number);return T.tasks[a].items[b]};
  main.querySelectorAll('input.blank').forEach(inp=>inp.oninput=()=>{inp.value=inp.value.replace(/[^\d\s]/g,'').slice(0,16);itemOf(inp.dataset.k).user[+inp.dataset.i]=inp.value;prog()});
  main.querySelectorAll('.copt').forEach(b=>b.onclick=()=>{const it=itemOf(b.dataset.k);it.user=+b.dataset.o;
    b.parentElement.querySelectorAll('.copt').forEach((x,i)=>{x.classList.toggle('sel',i===it.user);x.querySelector('.box').textContent=i===it.user?'●':''});prog()});
  main.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{const it=itemOf(b.dataset.k);it.user[+b.dataset.i]=b.dataset.s;b.parentElement.querySelectorAll('.sg').forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-pressed',x===b)});prog()});
  const fin=()=>{const [a,n]=countAnswered();if(a<n&&!confirm(`Puste okienka: ${n-a}. Na pewno sprawdzić?`))return;finishTest(false)};
  document.getElementById('fin').onclick=fin;document.getElementById('fin2').onclick=fin;
}
function finishTest(timeout){
  stopClock();const T=S.test;if(!T)return;let p=0,mx=0;const per=[];const wrong=[];
  T.tasks.forEach((t,ti)=>{let tp=0,tm=0;t.items.forEach(it=>{const c=checkItem(it,it.user);it.check=c;tp+=c.p;tm+=maxPts(it);addStat(it.topic,c.p===maxPts(it));if(c.p<maxPts(it))wrong.push(it)});p+=tp;mx+=tm;per.push([tp,tm])});
  const pct=p/mx*100,g=gradeFor(pct),ms=Date.now()-T.start;
  const rec={d:Date.now(),p,mx,pct,g,ms,day:T.day,timeout,mist:wrong.map(it=>({topic:it.topic,q:it.q.replace(/<br>/g,' · ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\[\?\]/g,'…'),ans:it.t==='choice'?it.opts.find(o=>o.ok).x:it.ans.join(', '),user:it.t==='choice'?(it.user!=null?it.opts[it.user].x:'—'):it.user.map(x=>clean(x)||'—').join(', ')}))};
  const h=store('m5-history')||[];h.unshift(rec);store('m5-history',h.slice(0,40));
  if(T.day!=null){const ps=planState();ps[T.day]=g;store('m5-plan',ps)}
  S.lastResult={T,p,mx,pct,g,ms,per,wrong,timeout};S.test=null;go('result');
}
function renderResult(){
  const {T,p,mx,pct,g,ms,per,wrong,timeout}=S.lastResult;
  main.innerHTML=`<section class="panel"><div class="result-top">
    <div class="grade" aria-label="Ocena ${g}"><svg viewBox="0 0 150 150" aria-hidden="true"><path d="M78 14 C 30 10, 10 50, 16 88 C 22 128, 70 142, 108 128 C 142 114, 146 62, 124 34 C 108 14, 80 8, 56 18"/></svg><div class="digit">${g}</div></div>
    <div><p class="gname">${GRADES[g]}</p><p style="margin:6px 0 0;font-size:1.1rem"><b>${pts(p)}</b> z ${mx} pkt, czyli ${Math.round(pct)}%</p>
    <p class="muted" style="margin:4px 0 0">${MSG[g]} Czas: ${mmss(ms/1000)}${timeout?' (czas minął)':''}.</p></div></div>
    <div class="chips">${per.map(([a,b],i)=>`<span class="chip ${a<b?'bad':''}">Zad. ${i+1}: ${a}/${b}</span>`).join('')}</div>
    <div class="row" style="margin-top:16px">${wrong.length?`<button class="btn" id="fix">Popraw błędy (${wrong.length})</button>`:''}<button class="btn ghost" id="again">Nowy sprawdzian</button><button class="btn ghost" id="toplan">Plan</button></div>
  </section>
  <h2 style="font-family:var(--hand);font-size:2rem;color:var(--ink);margin:6px 0 10px">Rozwiązania</h2>
  ${T.tasks.map((t,ti)=>`<section class="task"><div class="thead"><span class="tnum">${ti+1}</span><span class="tins">${t.ins}</span><span class="tpts">${per[ti][0]}/${per[ti][1]} pkt</span></div>
    ${t.items.map((it,ii)=>{const full=it.check.p===maxPts(it);return `<div class="it" style="flex-wrap:wrap">${t.items.length>1?`<span class="lt">${'abcdef'[ii]})</span>`:''}${itemHTML(it,'r',it.check)}
      ${full?'':`<div style="flex-basis:100%;padding-left:1.4em"><div class="steps">${it.why}</div></div>`}</div>`}).join('')}</section>`).join('')}`;
  const fx=document.getElementById('fix');if(fx)fx.onclick=()=>startFix(wrong);
  document.getElementById('again').onclick=()=>go('test');
  document.getElementById('toplan').onclick=()=>go('plan');
}

/* ---------- TRENING ---------- */
function renderTrainSetup(){
  const st=stats();
  main.innerHTML=`<section class="panel"><h2>Trening</h2><p>10 pytań, po każdej odpowiedzi od razu widzisz, czy dobrze, i jak to policzyć. Błędne pytanie wraca jeszcze raz z innymi liczbami.</p>
  <div class="row"><button class="btn" id="tw">Moje słabe punkty</button><button class="btn ghost" id="tall">Wszystko po trochu</button></div></section>
  <div class="tlist">${TOPICS.map(t=>{const s=st[t.id];const a=s&&s.n?s.ok/s.n:null;
    return `<button class="tbtn" data-t="${t.id}"><b>${t.name}</b><br><small>${a==null?'jeszcze nie ćwiczone':`${Math.round(a*100)}% dobrze (${s.n} odp.)`}</small><div class="acc"><i style="width:${a==null?0:a*100}%"></i></div></button>`}).join('')}</div>`;
  main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTrain([b.dataset.t],10,tname(b.dataset.t)));
  document.getElementById('tw').onclick=()=>startWeakTrain();
  document.getElementById('tall').onclick=()=>startTrain(TOPICS.map(t=>t.id),10,'Wszystko po trochu');
}
function startWeakTrain(){
  const w=TOPICS.map(t=>{const a=acc(t.id);return {id:t.id,w:a==null?1.5:1+5*(1-a)}});
  const tot=w.reduce((s,x)=>s+x.w,0);const q=[];
  for(let i=0;i<10;i++){let r=Math.random()*tot;const t=w.find(x=>(r-=x.w)<=0)||w[0];q.push(anyFrom(t.id))}
  S.train={q,i:0,ok:0,title:'Moje słabe punkty',n0:q.length};prepTrain();go('trainrun');
}
function startTrain(topics,n,title){
  const q=[];for(let i=0;i<n;i++)q.push(anyFrom(topics[i%topics.length]));
  S.train={q:shuffle(q),i:0,ok:0,title,n0:q.length};prepTrain();go('trainrun');
}
function startFix(wrong){
  const q=[];wrong.forEach(it=>{const c={...it};delete c.check;q.push(c)});wrong.forEach(it=>q.push(make(...it.gen)));
  S.train={q,i:0,ok:0,title:'Poprawa błędów',n0:q.length};prepTrain();go('trainrun');
}
function prepTrain(){S.train.q.forEach(it=>{it.user=it.t==='choice'?null:[];it.check=null})}
function renderTrain(){
  const Z=S.train;
  if(Z.i>=Z.q.length){
    const pct=Math.round(Z.ok/Z.n0*100);
    main.innerHTML=`<section class="panel"><h2>${Z.title}: koniec</h2><p style="font-size:1.15rem">Dobrze za pierwszym razem: <b>${Z.ok} z ${Z.n0}</b> (${pct}%).</p>
    <p class="muted">${pct>=90?'Super! Ten temat masz opanowany.':pct>=70?'Dobrze. Jutro powtórz ten temat jeszcze raz.':'Przeczytaj powtórkę tego tematu i spróbuj ponownie.'}</p>
    <div class="row"><button class="btn" id="more">Jeszcze 10 pytań</button><button class="btn ghost" id="back">Wróć</button></div></section>`;
    document.getElementById('more').onclick=()=>{const topics=[...new Set(Z.q.map(x=>x.topic))];startTrain(topics,10,Z.title)};
    document.getElementById('back').onclick=()=>go('plan');return;
  }
  const it=Z.q[Z.i],chk=it.check;
  const hasAns=it.t==='choice'?it.user!=null:it.ans.every((_,i)=>clean(it.user[i])!=='');
  let fb='';if(chk){const full=chk.p===maxPts(it);const cls=full?'ok':chk.p>0?'half':'no';
    fb=`<div class="fb ${cls}" role="status"><b>${full?'✓ Dobrze!':chk.p>0?'Częściowo dobrze':'✗ Jeszcze nie'}</b>${full?'':'Tak to policzysz:'}<div class="steps">${it.why}</div></div>`}
  main.innerHTML=`<section class="panel">
    <div class="progress"><i style="width:${(Z.i+(chk?1:0))/Z.q.length*100}%"></i></div>
    <div class="row" style="justify-content:space-between;color:var(--muted);font-size:.9rem"><span>${Z.title}: pytanie ${Z.i+1} z ${Z.q.length}</span><span>${tname(it.topic)}</span></div>
    <div class="qtext">${itemHTML(it,'t',chk||undefined)}</div>${fb}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="lrn">Powtórka tematu</button><button class="btn" id="nx" ${chk||hasAns?'':'disabled'}>${chk?(Z.i===Z.q.length-1?'Zakończ':'Dalej'):'Sprawdź'}</button></div></section>`;
  const nx=document.getElementById('nx');
  main.querySelectorAll('input.blank').forEach((inp,idx)=>{inp.oninput=()=>{inp.value=inp.value.replace(/[^\d\s]/g,'').slice(0,16);it.user[+inp.dataset.i]=inp.value;nx.disabled=!it.ans.every((_,i)=>clean(it.user[i])!=='')};
    inp.onkeydown=e=>{if(e.key==='Enter'&&!nx.disabled)nx.click()}; if(idx===0&&!chk)inp.focus()});
  main.querySelectorAll('.copt').forEach(b=>b.onclick=()=>{it.user=+b.dataset.o;renderTrain()});
  main.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{it.user[+b.dataset.i]=b.dataset.s;renderTrain()});
  nx.onclick=()=>{if(!chk){const c=checkItem(it,it.user);it.check=c;const full=c.p===maxPts(it);addStat(it.topic,full);
      if(full&&!it.retry)Z.ok++;
      if(!full&&!it.retry){const nv=make(...it.gen);nv.retry=true;nv.user=nv.t==='choice'?null:[];Z.q.splice(Math.min(Z.q.length,Z.i+4),0,nv)}
      renderTrain();document.getElementById('nx').focus()}
    else{Z.i++;renderTrain();window.scrollTo({top:0})}};
  document.getElementById('lrn').onclick=()=>{S.topic=it.topic;go('learn')};
}

/* ---------- WYNIKI ---------- */
function renderResults(){
  const h=store('m5-history')||[];const st=stats();
  main.innerHTML=`<section class="panel"><h2>Wyniki sprawdzianów</h2>
  ${h.length?`<div style="overflow-x:auto"><table class="hist"><thead><tr><th>Data</th><th>Ocena</th><th>Punkty</th><th>Czas</th><th>Błędy</th></tr></thead><tbody>
  ${h.map(r=>`<tr><td>${new Date(r.d).toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}${r.day!=null?`<br><small class="muted">dzień ${r.day+1}</small>`:''}</td><td class="g">${r.g}</td><td>${pts(r.p)}/${r.mx}<br><small class="muted">${Math.round(r.pct)}%</small></td><td>${mmss(r.ms/1000)}</td>
    <td>${r.mist.length?`<details><summary>${r.mist.length}</summary><ul style="padding-left:1.1em;margin:6px 0">${r.mist.map(m=>`<li><small>${esc(m.q)}<br>podano: <b>${esc(m.user)}</b>, poprawnie: <b>${esc(m.ans)}</b></small></li>`).join('')}</ul></details>`:'0'}</td></tr>`).join('')}</tbody></table></div>`
  :'<p>Nie ma jeszcze wyników. Zrób pierwszą kartkówkę próbną w zakładce Kartkówka albo z planu.</p>'}
  </section>
  <section class="panel"><h2>Tematy</h2><div class="tlist">${TOPICS.map(t=>{const s=st[t.id];const a=s&&s.n?s.ok/s.n:null;
    return `<div class="tbtn" style="cursor:default"><b>${t.name}</b><br><small>${a==null?'brak odpowiedzi':`${Math.round(a*100)}% dobrze (${s.n} odp.)`}</small><div class="acc"><i style="width:${a==null?0:a*100}%"></i></div></div>`}).join('')}</div>
  <details><summary>Wyczyść dane (wyniki, statystyki i plan)</summary><p class="muted">Usunie wszystko zapisane na tym urządzeniu.</p><button class="btn ghost small" id="clr">Wyczyść</button></details></section>`;
  const c=document.getElementById('clr');if(c)c.onclick=()=>{if(confirm('Usunąć wszystkie wyniki?')){['m5-history','m5-stats','m5-plan'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});renderResults()}};
}

go('plan');
</script>
</body>
</html>
